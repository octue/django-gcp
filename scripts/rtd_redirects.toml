"/tasks_about.html" = "/tasks/"
"/tasks_usage.html" = "/tasks/usage/"
"/tasks_settings.html" = "/tasks/settings/"
"/tasks_workers.html" = "/tasks/workers/"
"/workflows.html" = "/workflows/"
"/workflows_about.html" = "/workflows/"
"/workflows_usage.html" = "/workflows/usage/"
"/workflows_tips.html" = "/workflows/tips/"
"/logs.html" = "/logs/"
"/cloud_run.html" = "/cloud-run/"
"/projects.html" = "/projects/"
"/version_history.html" = "/version-history/"
"/license.html" = "/license/"
"/api.html" = "/"
