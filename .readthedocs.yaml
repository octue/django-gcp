# Read the Docs builds the documentation site with Zensical (https://zensical.org), which is not one of RTD's
# natively-supported tools, so the build is fully specified here as commands. RTD publishes whatever lands in
# $READTHEDOCS_OUTPUT/html. See https://docs.readthedocs.com/platform/latest/intro/zensical.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.13'
  jobs:
    install:
      # Keep this pin in step with the `docs` dependency group in pyproject.toml
      - pip install zensical==0.0.63
    build:
      html:
        # Strict mode fails the build on a broken internal link rather than publishing it
        - zensical build --clean --strict
    post_build:
      - mkdir --parents $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
