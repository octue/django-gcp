name: cd
description: This workflow releases a new version of the package before publishing it to PyPI.

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    if: '${{ github.event.pull_request.merged == true }}'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get package version
        id: get-package-version
        run: echo "package_version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BODY: ${{ github.event.pull_request.body }}
        run: gh release create "${{ steps.get-package-version.outputs.package_version }}" --title "$RELEASE_TITLE" --notes "$RELEASE_BODY"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false
          python-version: 3.13

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
